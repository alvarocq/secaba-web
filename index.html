<style>
/* Maquetación: cartel climático. La página se calienta al bajar (de azul glaciar a naranja invernadero); cifras enormes, comparación de CO₂ de entonces y de hoy */
:root{
  --bg:#f4f6f7; --ink:#0f1417; --muted:#56616a; --line:#d6dde2; --card:#ffffff;
  --cold:#2b6cb0; --warm:#e8590c; --hot:#c92a2a; --bar:#d9480f;
  --f-disp:"Bricolage Grotesque", "Arial Black", sans-serif; --f-body:"Public Sans", system-ui, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1013; --ink:#eef2f4; --muted:#9aa7b0; --line:#25303a; --card:#141b21; --cold:#74a9e8; --warm:#ff8a4c; --hot:#ff6b6b; --bar:#ff8a4c; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1013; --ink:#eef2f4; --muted:#9aa7b0; --line:#25303a; --card:#141b21; --cold:#74a9e8; --warm:#ff8a4c; --hot:#ff6b6b; --bar:#ff8a4c; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg); color:var(--ink); font:17px/1.65 var(--f-body)}
img{max-width:100%; height:auto; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--warm); outline-offset:3px}
h1,h2,h3{font-family:var(--f-disp); margin:0; text-wrap:balance; line-height:.95}
p{margin:0}
.mono{font:500 .74rem/1.35 var(--f-mono); letter-spacing:.06em; text-transform:uppercase}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Termómetro superior: progreso de lectura de frío a calor */
.heat{position:fixed; left:0; right:0; top:0; height:calc(4px + env(safe-area-inset-top,0px)); z-index:20; background:var(--line)}
.heat i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cold),var(--warm),var(--hot))}
header.bar{display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding-block:18px}
header .logo{font:800 1.2rem var(--f-disp); letter-spacing:.02em}
header nav{display:flex; gap:4px 16px; flex-wrap:wrap; margin-left:auto; font-size:.88rem}
header nav a{text-decoration:none; color:var(--muted)} header nav a:hover{color:var(--ink)}
.lang{font:500 .74rem var(--f-mono); padding:6px 12px; border-radius:999px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer}
.lang:hover{background:var(--ink); color:var(--bg)}
.tools{display:flex; gap:8px; align-items:center}
.ico-btn{display:inline-flex; align-items:center; gap:6px}
.ico-btn svg{width:14px; height:14px; display:block}

.hero{padding-block:clamp(32px,6vw,80px) clamp(40px,6vw,72px); position:relative; overflow-x:clip}
html,body{overflow-x:clip}
.hero>*:not(.coco3d){position:relative; z-index:1}
/* Cocolito 3D: detrás del titular, a la derecha; no captura el puntero */
.coco3d{position:absolute; z-index:0; pointer-events:none; right:max(-6vw,-80px); top:clamp(-20px,-2vw,0px); width:min(58vw,760px); aspect-ratio:1}
@media (max-width:860px){.coco3d{width:92vw; right:-28vw; top:20px; opacity:.6}}
.hero .mono{color:var(--warm)}
.hero h1{font-size:clamp(4rem,17vw,15rem); font-weight:800; font-stretch:78%; letter-spacing:-.04em; line-height:.82; margin-top:14px}
.hero .ptitle{font:700 clamp(1.4rem,3vw,2.5rem)/1.12 var(--f-disp); font-stretch:88%; letter-spacing:-.01em; max-width:30ch; margin-top:18px; text-wrap:balance}
.hero .psub{font-size:clamp(1rem,1.5vw,1.2rem); color:var(--muted); margin-top:10px}
.hero .kind{display:inline-block; margin-top:22px; font:600 clamp(.8rem,1.2vw,.95rem)/1 var(--f-body); letter-spacing:.06em; text-transform:uppercase; padding:9px 14px; border-radius:999px; background:var(--ink); color:var(--bg)}
.cta{display:grid; gap:4px; text-decoration:none; padding:16px 18px; border-radius:16px; border:1px solid var(--ink); background:var(--card); transition:background .15s,color .15s}

.cta span{font-size:.88rem; color:var(--muted)}
.cta:hover{background:var(--ink); color:var(--bg)}

.hero h1 span{background:linear-gradient(90deg,var(--cold),var(--warm) 55%,var(--hot)); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .row{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:clamp(20px,4vw,56px); margin-top:clamp(28px,4vw,48px)}
@media (max-width:860px){.hero .row{grid-template-columns:1fr}}
.hero .lead{font-size:clamp(1.05rem,1.6vw,1.28rem)}
.hero .t{font:600 1.05rem/1.35 var(--f-disp); color:var(--muted)}
.hero .t b{display:block; color:var(--ink); font-size:1.15em; margin-bottom:6px}
.hero .ref{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:16px; color:var(--muted)}

.h2q{font-size:clamp(1.05rem,1.7vw,1.35rem); line-height:1.5; margin-top:20px; max-width:58ch; color:rgba(255,255,255,.92)}
.drv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:clamp(28px,4vw,48px)}
@media (max-width:820px){.drv{grid-template-columns:1fr}}
.drv div{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); border-radius:18px; padding:18px; display:grid; gap:6px; align-content:start; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px)}
.drv .ico{width:40px; height:40px; color:#fff}
.drv .ico svg{width:100%; height:100%; display:block}
.drv b{font:700 1.25rem var(--f-disp)}
.drv span:last-child{font-size:.9rem; color:rgba(255,255,255,.88)}
/* Gráfica de CO₂: barras horizontales, una serie */
.chart{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:clamp(18px,3vw,32px); position:relative}

.bars{display:grid; gap:14px; margin-top:22px}
.br{display:grid; grid-template-columns:minmax(0,10rem) minmax(0,1fr); gap:12px; align-items:center; cursor:default}

.br .lb{font-size:.88rem}
.br .tr{position:relative; height:26px; background:linear-gradient(90deg,var(--line) 0 1px,transparent 1px) 0 0/25% 100%}
.br .f{position:absolute; left:0; top:4px; bottom:4px; background:var(--bar); border-radius:0 4px 4px 0; width:var(--w); transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.br.now .f{background:var(--ink)}
.br .v{position:absolute; top:50%; transform:translateY(-50%); left:calc(var(--w) + 8px); font:500 .78rem var(--f-mono); color:var(--ink); white-space:nowrap}

.axis{display:grid; grid-template-columns:minmax(0,10rem) minmax(0,1fr); gap:12px; margin-top:6px}
@media (max-width:520px){.axis{grid-template-columns:1fr}.axis>span:first-child{display:none}}
.axis div{display:flex; justify-content:space-between; font:400 .7rem var(--f-mono); color:var(--muted)}
.src{font-size:.75rem; color:var(--muted); margin-top:14px}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font:500 .75rem/1.4 var(--f-mono); padding:6px 9px; border-radius:6px; opacity:0; transition:opacity .12s; white-space:nowrap}

/* Escala temporal de episodios */
.scale{position:relative; margin-top:36px; padding-top:44px}
.scale .line{height:12px; border-radius:6px; background:linear-gradient(90deg,var(--cold),var(--warm) 70%,var(--hot))}
.scale .tk{display:flex; justify-content:space-between; font:400 .7rem var(--f-mono); color:var(--muted); margin-top:8px}
.scale .pin{position:absolute; top:0; transform:translateX(-50%); display:grid; justify-items:center; gap:4px}
.scale .pin b{font:800 1rem var(--f-disp)}
.scale .pin i{width:2px; height:22px; background:var(--ink)}
.eps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:40px}
@media (max-width:820px){.eps{grid-template-columns:1fr}}
.ep{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; display:grid; gap:10px; align-content:start; border-top:6px solid var(--c)}
.ep h3{font-size:clamp(2.2rem,4vw,3rem); font-weight:800; font-stretch:78%}
.ep .mono{color:var(--muted)}
.qs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:36px}
@media (max-width:760px){.qs{grid-template-columns:1fr}}
.q{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px; display:grid; gap:10px}
.q .mono{color:var(--warm)}
.q h3{font-size:clamp(1.4rem,2.4vw,2rem); font-weight:700; font-stretch:88%}
.q p{color:var(--muted)}
.synth{margin-top:16px; padding:26px; border-radius:18px; background:linear-gradient(110deg,var(--cold),var(--warm) 60%,var(--hot)); color:#fff; font:600 clamp(1.15rem,2vw,1.5rem)/1.3 var(--f-disp)}
.methods{display:flex; flex-wrap:wrap; gap:10px; margin-top:32px}
.mt{border:1px solid var(--line); border-radius:999px; padding:10px 18px; background:var(--card); display:grid; max-width:100%}
.mt b{font:700 1.05rem var(--f-disp)}
.mt span{font-size:.84rem; color:var(--muted)}
.sites{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:14px; margin-top:32px}
.site{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:grid; grid-template-rows:auto 1fr}
.site .ph{aspect-ratio:16/10; background:linear-gradient(135deg,var(--cold),var(--warm)); overflow:hidden}
.site .ph img{width:100%; height:100%; object-fit:cover}
.site .b{padding:16px 18px 20px; display:grid; gap:8px; align-content:start}
.site h3{font-size:1.3rem; font-weight:700}
.site p{font-size:.88rem; color:var(--muted)}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tag{font:500 .64rem/1 var(--f-mono); padding:5px 8px; border-radius:999px; background:var(--warm); color:#fff}
/* Mapa de lugares */
.atlas{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:clamp(16px,2.6vw,32px); margin-top:32px; align-items:start}
@media (max-width:900px){.atlas{grid-template-columns:1fr}}
.map{position:sticky; top:20px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; overflow:hidden}
@media (max-width:900px){.map{position:relative; top:0}}
.map svg{width:100%; height:auto; display:block}
.map .sea{fill:url(#seaG)}
.map .land{fill:var(--bg); stroke:var(--ink); stroke-width:.35; stroke-linejoin:round}
.map .grat{stroke:var(--ink); stroke-opacity:.08; stroke-width:.25}
.map .pin{cursor:pointer}
.map .pin .dot{fill:var(--warm); stroke:var(--bg); stroke-width:.8}
.map .pin .halo{fill:var(--warm); opacity:.22}
.map .pin.on .dot{fill:var(--ink)}
.map .pin.on .halo{fill:var(--ink); opacity:.18}
.map .pin .hit{fill:transparent}
.map .pin:focus-visible{outline:none}
.map .pin:focus-visible .dot{stroke:var(--ink); stroke-width:1}
.map .lbl{font:600 3.2px var(--f-body); fill:var(--ink); paint-order:stroke; stroke:var(--bg); stroke-width:1.2px; pointer-events:none}
.map .note{font:400 2.8px var(--f-mono); fill:var(--muted)}

.sl .ph img{width:100%; height:100%; object-fit:cover}
.sl .b{padding:12px 14px; display:grid; gap:5px; align-content:start}
.sl h3{font-size:1.15rem; font-weight:700}
.sl .mono{color:var(--muted); font-size:.66rem}

.gantt{overflow-x:auto; margin-top:32px}

.ms{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}

.rec{display:grid; border-top:2px solid var(--ink)}
.rec div{display:grid; grid-template-columns:5ch 1fr; gap:16px; padding:11px 0; border-bottom:1px solid var(--line); align-items:baseline}
.rec b{font:800 1.3rem var(--f-disp); font-stretch:80%; color:var(--warm); font-variant-numeric:tabular-nums}
.team{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:12px}
.pp{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:grid; gap:4px; min-width:0}
.pp h3{font-size:1.1rem; font-weight:700}
.pp h3 sup{font:500 .6rem var(--f-mono); color:var(--warm); margin-left:6px}
.pp p{font-size:.85rem; color:var(--muted)}
.pp a{font:400 .68rem var(--f-mono); color:var(--muted); text-decoration:none; overflow-wrap:anywhere}
.pp a:hover{color:var(--warm)}
.gt{margin:28px 0 12px; color:var(--muted)}
.out{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:12px; margin-top:28px}
.out div{border-left:3px solid var(--warm); padding:4px 0 4px 14px}
.out b{font:700 1.05rem var(--f-disp); display:block}

.empty{margin-top:20px; border:1px dashed var(--line); border-radius:14px; padding:18px; color:var(--muted)}
.contact{background:var(--ink); color:var(--bg); padding-block:clamp(32px,4vw,48px)}
.contact .cgrid{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px 32px; align-items:center}
@media (max-width:860px){.contact .cgrid{grid-template-columns:1fr}}
.contact h2{font:700 1.4rem var(--f-disp)}
.contact .who{font-size:.92rem; opacity:.75; max-width:70ch}
.contact .mail{display:flex; flex-wrap:wrap; gap:10px; align-items:center; font:500 .95rem var(--f-mono); overflow-wrap:anywhere}
.btn{font:500 .72rem var(--f-mono); text-transform:uppercase; padding:8px 14px; border-radius:999px; border:0; background:var(--warm); color:#fff; cursor:pointer}
footer{background:var(--ink); color:var(--bg); border-top:1px solid rgba(255,255,255,.12)}
footer .wrap{padding-block:24px; display:grid; gap:6px; font-size:.8rem; opacity:.75}
</style>
