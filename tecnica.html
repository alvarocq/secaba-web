/* Maquetación: documento técnico. Banda azul océano arriba, índice lateral fijo y una columna de lectura con tablas, códigos de tarea y referencias */
:root{

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth; scroll-padding-top:20px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 var(--f-body)}
img{max-width:100%; height:auto; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-disp); margin:0; line-height:1.2; text-wrap:balance}
h2{font-size:clamp(1.5rem,2.6vw,1.95rem); font-weight:700}
h3{font-size:1.12rem; font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono); font-size:.8rem}
.wrap{max-width:1200px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}

.band{background:var(--deep); color:var(--on-ocean)}
.band .top{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding-block:12px; border-bottom:1px solid rgba(255,255,255,.12)}
.band .brand{font:700 1.1rem var(--f-disp)}
.band .tag{font:500 .7rem var(--f-mono); letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:3px; background:rgba(255,255,255,.12)}

.btn{display:inline-flex; align-items:center; gap:6px; font:500 .76rem var(--f-mono); padding:6px 10px; border-radius:4px; border:1px solid rgba(255,255,255,.4); background:transparent; color:var(--on-ocean); cursor:pointer; text-decoration:none}

.band .eyebrow{font:500 .74rem var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:#f2b532}
.band h1{font-size:clamp(1.6rem,3.4vw,2.6rem); font-weight:700}
.band .en{color:rgba(238,244,247,.75); font-style:italic; font-family:var(--f-disp); font-size:1.05rem}

.layout{display:grid; grid-template-columns:230px minmax(0,1fr); gap:clamp(24px,4vw,56px); padding-block:40px 64px}

.toc{position:sticky; top:16px; align-self:start; display:grid; gap:2px; font-size:.88rem}
.toc a{text-decoration:none; color:var(--muted); padding:5px 10px; border-left:2px solid var(--line)}
.toc a:hover,.toc a.on{color:var(--ink); border-left-color:var(--accent)}

.facts{display:grid; grid-template-columns:max-content 1fr; gap:0; border:1px solid var(--line); border-radius:6px; background:var(--surface); overflow:hidden}
.facts dt,.facts dd{margin:0; padding:9px 14px; border-bottom:1px solid var(--line); font-size:.9rem}
.facts dt{font:500 .74rem var(--f-mono); color:var(--muted); background:var(--soft); text-transform:uppercase; letter-spacing:.04em}
.facts dd{min-width:0; overflow-wrap:anywhere}

.todo{color:#c2410c}
.goals{display:grid; gap:12px}
.og{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 18px; display:grid; gap:8px}
.og .c{font:600 .78rem var(--f-mono); color:var(--accent)}
.og ul{margin:0; padding-left:1.1em; display:grid; gap:4px; font-size:.9rem}
.og li b{font-family:var(--f-mono); font-weight:500; font-size:.78rem; margin-right:6px}
.gantt td.q{padding:9px 0; min-width:26px; text-align:center}
.gantt td.q span{display:block; height:10px; background:var(--bar); margin-inline:1px}

.gantt th.q{text-align:center; padding:9px 0}
.ms{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.86rem}
.ms b{font-family:var(--f-mono); color:var(--accent); margin-right:6px}
.refs{display:grid; gap:10px; padding-left:0; list-style:none; margin:0}
.refs li{font-size:.9rem; padding-left:14px; border-left:2px solid var(--line)}
.refs a{color:var(--muted); font-family:var(--f-mono); font-size:.78rem; overflow-wrap:anywhere}
.refs a:hover{color:var(--accent)}
.figs{display:grid; gap:28px}
.small{max-width:560px}
.empty{border:1px dashed var(--line); border-radius:6px; padding:16px; color:var(--muted); font-size:.9rem}
footer{background:var(--deep); color:var(--on-ocean); font-size:.82rem}
footer .wrap{padding-block:24px; display:grid; gap:12px}
footer span{opacity:.8}
/* Franja de PXS: color propio (degradado de la web) para que destaque */

.pxsband #pxs-reveal:hover{transform:translateY(-1px)}
.pxsband #pxs-contact a{color:#fff!important}

      ant:[

        "<b>Episodio Selli (OAE 1a).</b> Aptiense inferior (~120 Ma). Excursión isotópica negativa y posterior positiva dividida en segmentos (Menegatti et al., 1998), calentamiento de 4–8 °C, crisis de los nannocónidos y anoxia generalizada. El equipo realizó la primera estimación cuantitativa de pCO₂ (≈1000 → 2200 ppm en ~300 ka; Naafs et al., 2016), propuso una doble fuente metanogénica y volcánica (Adloff et al., 2020) y mostró con isótopos de Os que la fase volcánica principal de Ontong Java es posterior al inicio del evento (Martínez-Rodríguez et al., 2021). La calibración astrocronológica de Cau estima 230 ka para el inicio (segmento Ap3), con una fase inicial de menos de 10 ka (Martínez-Rodríguez et al., 2024)."

      ant:[
        "Earth’s climate has alternated between greenhouse and icehouse states. Climate projections carry intrinsic uncertainty (Lewandowsky et al., 2015; IPCC, 2022), and the geological record holds analogue episodes that help constrain the Earth-system response to rising greenhouse gases (Ridgwell and Valdes, 2009).",
        "The most widely accepted causes of oceanic anoxic events (OAEs) are high global temperatures linked to volcanogenic or methanogenic gases, which accelerated the hydrological cycle, weathering and primary productivity (Jenkyns, 2010; Erba et al., 2015). Not every carbon-cycle perturbation led to widespread anoxia, so Föllmi (2012) introduced episodes of environmental change (EECs): Weissert, Faraoni, Taxy, Fallot, Paquier and probably the Mid-Barremian Episode and the Intra-Furcata excursion.",

        "<b>Selli Episode (OAE 1a).</b> Early Aptian (~120 Ma). A negative then positive isotope excursion divided into segments (Menegatti et al., 1998), 4–8 °C warming, the nannoconid crisis and widespread anoxia. The team produced the first quantitative pCO₂ estimate (≈1000 → 2200 ppm over ~300 kyr; Naafs et al., 2016), proposed a dual methanogenic and volcanic source (Adloff et al., 2020) and showed with Os isotopes that the main Ontong Java volcanic phase post-dates the onset (Martínez-Rodríguez et al., 2021). Astrochronology of the Cau core gives 230 kyr for the onset (segment Ap3), with an initial phase shorter than 10 kyr (Martínez-Rodríguez et al., 2024)."
